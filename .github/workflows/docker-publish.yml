
name: Build and Push CareerBridge Docker Images

on:
  push:
    branches:
      - feature/skill-exchange

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./CareerBridge/backend
          push: true
          tags: meghana1624/careerbridge-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./CareerBridge/frontend
          push: true
          tags: meghana1624/careerbridge-frontend:latest
