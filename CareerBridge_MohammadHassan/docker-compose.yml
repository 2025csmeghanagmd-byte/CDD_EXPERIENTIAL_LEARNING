version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: careerbridge-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: careerbridge
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend Service
  backend:
    build: ./backend
    container_name: careerbridge-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DB: careerbridge
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: careerbridge
      JWT_SECRET_KEY: careerbridge-super-secure-jwt-secret-key-2024-enterprise
      SECRET_KEY: careerbridge-flask-secret-key-32chars-long-enterprise
      FLASK_ENV: development

  # React Frontend Service
  frontend:
    build: ./frontend
    container_name: careerbridge-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
